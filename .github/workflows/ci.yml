name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test

            - name: Audit dependencies
              # Advisories in the dependency tree are a supply-chain finding
              # like any other; this surfaces them on every PR rather than
              # whenever somebody remembers to look. Moderate and below are
              # reported without failing the build, so a new advisory in a dev
              # dependency does not block unrelated work.
              run: pnpm audit --audit-level high

            - name: Build
              # The public origins and the cluster are required in a production
              # build (a missing one fails the build instead of shipping a link
              # to localhost or an explorer pointed at the wrong cluster). CI is
              # not a deployment, so placeholders are enough to compile.
              env:
                  NEXT_PUBLIC_SITE_URL: https://kairos.example
                  NEXT_PUBLIC_DASHBOARD_URL: https://app.kairos.example
                  NEXT_PUBLIC_NETWORK: devnet
                  NEXT_PUBLIC_SOLANA_CLUSTER: devnet
              run: pnpm build
